<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אלבום המסע - סלובניה &amp; טריאסט 2026</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Heebo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{font-family:'Heebo',-apple-system,Arial,sans-serif;background:#080b0d;color:#fff;overflow-x:hidden;}

  .progress{position:fixed;top:0;right:0;height:4px;width:0;z-index:3000;
    background:linear-gradient(90deg,#d4a843,#e44d26);box-shadow:0 0 10px rgba(228,77,38,0.6);}

  .topnav{position:fixed;top:0;left:0;right:0;z-index:2500;display:flex;gap:8px;padding:10px 14px;
    background:linear-gradient(180deg,rgba(0,0,0,0.55),rgba(0,0,0,0));pointer-events:none;}
  .topnav a{pointer-events:auto;background:rgba(0,0,0,0.4);color:#fff;text-decoration:none;font-size:13px;font-weight:800;
    padding:7px 13px;border-radius:20px;backdrop-filter:blur(6px);}
  .topnav .sp{flex:1;}

  /* HERO */
  .hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;
    background:linear-gradient(130deg,#0d7377,#14a0a6,#d4a843,#e44d26);background-size:300% 300%;animation:grad 16s ease infinite;position:relative;}
  @keyframes grad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .hero .kick{font-family:'Caveat',cursive;font-size:30px;opacity:0;animation:fadeUp 1s .2s forwards;}
  .hero h1{font-size:44px;font-weight:900;line-height:1.1;margin:6px 0;text-shadow:0 4px 20px rgba(0,0,0,0.35);opacity:0;animation:fadeUp 1s .5s forwards;}
  .hero p{font-size:16px;opacity:0;animation:fadeUp 1s .9s forwards;}
  .hero .scroll{position:absolute;bottom:26px;font-size:14px;font-weight:700;opacity:0;animation:fadeUp 1s 1.3s forwards, bob 1.8s 2.3s infinite;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(9px)}}

  /* SCENE */
  .scene{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:90px 18px 70px;overflow:hidden;}
  .scenebg{position:absolute;inset:0;background-size:cover;background-position:center;background-color:#10343b;z-index:0;transform:scale(1.16);
    animation:ken 22s ease-in-out infinite alternate;}
  @keyframes ken{from{transform:scale(1.16) translate(0,0)}to{transform:scale(1.02) translate(0,-1.5%)}}
  .scene::before{content:'';position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg,rgba(6,9,11,0.5),rgba(6,9,11,0.28) 38%,rgba(6,9,11,0.88));}
  .scene .inner{position:relative;z-index:2;opacity:0;transform:translateY(30px);transition:opacity .9s ease,transform .9s ease;}
  .scene.in .inner{opacity:1;transform:translateY(0);}
  .scene .day{display:inline-block;background:#d4a843;color:#3a2e0a;font-weight:900;font-size:13px;padding:4px 18px;border-radius:20px;letter-spacing:.5px;}
  .scene h2{font-size:40px;font-weight:900;margin:12px 0 6px;text-shadow:0 4px 20px rgba(0,0,0,0.6);}
  .scene .blurb{max-width:580px;margin:0 auto 6px;font-size:15.5px;line-height:1.65;opacity:0.95;text-shadow:0 2px 8px rgba(0,0,0,0.5);}
  .scene .head{text-align:center;}

  /* POLAROID COLLAGE */
  .polas{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 6px;margin-top:28px;perspective:900px;}
  .pola{position:relative;background:#fff;padding:11px 11px 0;border-radius:2px;box-shadow:0 16px 34px rgba(0,0,0,0.55);
    width:44%;max-width:210px;cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.3,1.2),box-shadow .3s ease;margin:-4px;}
  .pola::before{content:'';position:absolute;top:-11px;right:50%;transform:translateX(50%) rotate(-4deg);
    width:78px;height:24px;background:rgba(255,240,180,0.6);box-shadow:0 2px 5px rgba(0,0,0,0.2);}
  /* varied tilt + size for a scattered collage feel */
  .pola:nth-child(6n+1){transform:rotate(-5deg) translateY(6px);}
  .pola:nth-child(6n+2){transform:rotate(3deg) translateY(-10px);width:50%;max-width:238px;z-index:3;}
  .pola:nth-child(6n+3){transform:rotate(-2deg) translateY(4px);}
  .pola:nth-child(6n+4){transform:rotate(4.5deg) translateY(-6px);width:40%;max-width:180px;}
  .pola:nth-child(6n+5){transform:rotate(-3.5deg) translateY(8px);}
  .pola:nth-child(6n){transform:rotate(2deg) translateY(-8px);width:48%;max-width:224px;z-index:2;}
  .pola:hover{transform:rotate(0) scale(1.08) translateY(0);z-index:9;box-shadow:0 24px 50px rgba(0,0,0,0.65);}
  .pola img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#eee;}
  .pola .cap{color:#3a3a3a;text-align:center;font-family:'Caveat',cursive;font-size:20px;padding:6px 4px 12px;}
  .addpola{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;width:45%;max-width:230px;min-height:160px;
    border:2px dashed rgba(255,255,255,0.65);border-radius:10px;color:#fff;background:rgba(255,255,255,0.1);cursor:pointer;font-weight:800;font-size:14px;text-align:center;padding:10px;}
  .addpola span{font-size:34px;}

  /* LEG / DRIVE */
  .leg{position:relative;padding:34px 14px 40px;background:radial-gradient(ellipse at top,#12303a,#080b0d 70%);text-align:center;}
  .leg .legh{font-family:'Caveat',cursive;font-size:26px;color:#f0d38a;margin-bottom:4px;}
  .leg .legh b{color:#fff;font-family:'Heebo';font-weight:900;font-size:20px;}
  .leg .cars{font-size:22px;letter-spacing:2px;margin-bottom:12px;animation:drift 2.2s ease-in-out infinite;}
  @keyframes drift{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
  .legmap{height:230px;border-radius:18px;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,0.6);border:2px solid rgba(212,168,67,0.35);}
  .car{font-size:26px;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.5));transform:scaleX(-1);}
  .leaflet-container{background:#0d2029;}

  /* VIEWER */
  .viewer{position:fixed;inset:0;z-index:3500;background:rgba(0,0,0,0.95);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px;}
  .viewer.show{display:flex;}
  .viewer img{max-width:94vw;max-height:72vh;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,0.6);}
  .viewer .vcap{color:#fff;margin-top:12px;font-family:'Caveat',cursive;font-size:22px;}
  .viewer .vbtns{margin-top:16px;display:flex;gap:10px;}
  .viewer button{border:none;padding:10px 20px;border-radius:22px;font-family:inherit;font-weight:800;cursor:pointer;}
  .vclose{background:#fff;color:#111;} .vdel{background:#c0392b;color:#fff;}

  /* CREW / MEET THE TRAVELERS */
  .crew{background:linear-gradient(160deg,#0d7377,#0a2a30);padding:54px 18px 60px;text-align:center;}
  .crew .kick{font-family:'Caveat',cursive;font-size:26px;color:#f0d38a;}
  .crew h2{font-size:30px;font-weight:900;margin:4px 0 6px;}
  .crew .sub{font-size:14px;opacity:0.85;max-width:520px;margin:0 auto 26px;line-height:1.6;}
  .crewGrid{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 16px;max-width:760px;margin:0 auto;}
  .person{position:relative;width:96px;}
  .person .ava{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid #f0d38a;box-shadow:0 8px 20px rgba(0,0,0,0.45);background:#0a2a30;}
  .person .pname{margin-top:8px;font-weight:800;font-size:14px;word-break:break-word;}
  .person .pdel{position:absolute;top:-4px;left:-4px;width:24px;height:24px;border-radius:50%;border:none;background:#c0392b;color:#fff;font-weight:900;cursor:pointer;display:none;}
  .person:hover .pdel{display:block;}
  .addperson{width:96px;height:96px;border-radius:50%;border:2px dashed rgba(255,255,255,0.6);background:rgba(255,255,255,0.1);
    color:#fff;font-size:13px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1;}
  .addperson span{font-size:26px;}
  .person .ava.addslot{display:flex;align-items:center;justify-content:center;font-size:30px;border-style:dashed;border-color:rgba(255,255,255,0.55);cursor:pointer;color:#f0d38a;}
  .person .ava.addslot:hover{background:rgba(255,255,255,0.16);}

  @media(min-width:640px){.pola,.addpola{width:220px;}.scene h2{font-size:52px;}.hero h1{font-size:60px;}.crew h2{font-size:40px;}}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div class="topnav">
  <a href="index.html">← ללו"ז</a><span class="sp"></span>
  <a href="#" onclick="scrollTo({top:0,behavior:'smooth'});return false;">↑ להתחלה</a>
</div>

<div class="hero">
  <div class="kick">המסע שלנו</div>
  <h1>סלובניה &amp; טריאסט</h1>
  <p>יולי 2026 · 12 בני משפחה · 3 רכבים</p>
  <div class="scroll">גללו למטה כדי לצאת לדרך ↓</div>
</div>

<section class="crew">
  <div class="kick">מי בנסיעה?</div>
  <h2>המשפחה שיצאה לדרך</h2>
  <div class="sub">העלו תמונה ושם של כל מי שהצטרף למסע. כך תהיה כאן "גלריית נוסעים" נחמדה בראש האלבום — וגם אוכל לדעת מי כל אחד כשתשתפו איתי תמונות מהטיול.</div>
  <div class="crewGrid" id="crewGrid">
    <button class="addperson" id="addPerson"><span>＋</span>הוסיפו נוסע</button>
  </div>
</section>

<div id="story"></div>

<div class="viewer" id="viewer">
  <img id="viewerImg" src="" alt="">
  <div class="vcap" id="viewerCap"></div>
  <div class="vbtns"><button class="vclose" id="vclose">✕ סגור</button><button class="vdel" id="vdel">🗑️ מחק</button></div>
</div>
<input type="file" id="fileInput" accept="image/*" multiple style="display:none">
<input type="file" id="personInput" accept="image/*" style="display:none">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Stable Wikimedia URLs via Special:FilePath (no need to know the file hash) — all filenames verified to exist.
var FP='https://commons.wikimedia.org/wiki/Special:FilePath/';
function wimg(file){return FP+encodeURIComponent(file)+'?width=1600';}
var STOPS=[
 {name:'לובליאנה',day:'ימים 1-2',lat:46.0500,lng:14.5064,
  bg:wimg('2021-07-28 Ljubljana-0881.jpg'),
  blurb:'הבירה הירוקה - טירה על גבעה, גשר הדרקונים, הגשר המשולש וגדות הנהר של פלצ׳ניק.'},
 {name:'טריאסט',day:'ימים 2-3',lat:45.6495,lng:13.7768,
  bg:wimg('Piazza Unità Trieste 08.jpg'),
  blurb:'״וינה שליד הים״ - Piazza Unità, הרציף Molo Audace, הקנאל גראנדה והקפה של איטליה.'},
 {name:'טירת Miramare',day:'יום 3',lat:45.7025,lng:13.7128,
  bg:wimg('Castello di Miramare (Trieste) (7).jpg'),
  blurb:'ארמון הבסבורגי לבן על שפת הים, עם גנים וסיפור טרגי של מקסימיליאן ושרלוטה.'},
 {name:'מערת Postojna',day:'יום 4',lat:45.7828,lng:14.2044,
  bg:wimg('Postojna Cave - Slovenia.jpg'),
  blurb:'רכבת חשמלית עמוק לתוך מערת נטיפים ענקית - וה־Olm, ״דרקון התינוק״.'},
 {name:'אגם בלד',day:'ימים 4-7',lat:46.3625,lng:14.0936,
  bg:wimg('Bled island, bled, slovenia.jpg'),
  blurb:'אחד הנופים היפים באירופה - אי עם כנסייה במרכז האגם וסירות Pletna מסורתיות.'},
 {name:'טירת בלד',day:'ימים 4-7',lat:46.3691,lng:14.1006,
  bg:wimg('Bled Castle - Bled, Slovenia (7451260928).jpg'),
  blurb:'הטירה העתיקה בסלובניה, על צוק מעל האגם - נוף פנורמי, חצר ומרפסת תצפית.'},
 {name:'נקיק Vintgar',day:'ימים 5-6',lat:46.3833,lng:14.0672,
  bg:wimg('Vintgar-gorge-bled-slovenia.jpg'),
  blurb:'שבילי עץ תלויים מעל מים טורקיז ומפלים, בתוך נקיק סלעי דרמטי.'},
 {name:'אגם Bohinj',day:'יום 6',lat:46.2775,lng:13.8875,
  bg:wimg('Bohinj slovenia 08.jpg'),
  blurb:'האגם הפראי והשקט בלב הפארק הלאומי טריגלב - אלפים בתוליים.'}
];

// progress bar
addEventListener('scroll',function(){
  var h=document.documentElement, sc=h.scrollTop||document.body.scrollTop;
  var mx=(h.scrollHeight-h.clientHeight)||1;
  document.getElementById('progress').style.width=(sc/mx*100)+'%';
},{passive:true});

// IndexedDB
var db;
function openDB(){return new Promise(function(res,rej){var r=indexedDB.open('tripAlbum2',2);
  r.onupgradeneeded=function(e){var d=e.target.result;
    if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id',autoIncrement:true});
    if(!d.objectStoreNames.contains('people'))d.createObjectStore('people',{keyPath:'id',autoIncrement:true});};
  r.onsuccess=function(e){db=e.target.result;res();};r.onerror=rej;});}
function savePerson(rec){return new Promise(function(res,rej){var tx=db.transaction('people','readwrite');
  var q=tx.objectStore('people').add(rec);q.onsuccess=function(){rec.id=q.result;};tx.oncomplete=function(){res(rec.id);};tx.onerror=rej;});}
function deletePerson(id){var tx=db.transaction('people','readwrite');tx.objectStore('people').delete(id);}
function allPeople(){return new Promise(function(res){var tx=db.transaction('people','readonly');
  var q=tx.objectStore('people').getAll();q.onsuccess=function(){res(q.result||[]);};});}
function savePhoto(rec){return new Promise(function(res,rej){var tx=db.transaction('photos','readwrite');
  var q=tx.objectStore('photos').add(rec);q.onsuccess=function(){rec.id=q.result;};tx.oncomplete=function(){res(rec.id);};tx.onerror=rej;});}
function deletePhoto(id){var tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);}
function photosForStop(idx){return new Promise(function(res){var tx=db.transaction('photos','readonly');
  var q=tx.objectStore('photos').getAll();q.onsuccess=function(){res((q.result||[]).filter(function(p){return p.stop===idx;}));};});}

// build
var story=document.getElementById('story');
function buildStory(){STOPS.forEach(function(s,i){ if(i>0) story.appendChild(makeLeg(STOPS[i-1],s)); story.appendChild(makeScene(s,i)); });}

// CREW
var crewGrid=document.getElementById('crewGrid'),personInput=document.getElementById('personInput'),addBtn=document.getElementById('addPerson');
// 12 pre-labeled slots so photos just get attached to a name
var CREW=['סבא יוסי אברהם','סבתא רחל אברהם','מוטי אלנקוה (אבא)','רויטל אברהם אלנקוה (אמא)',
  'נועם אלנקוה (בת 15)','איתן אלנקוה (בן 13)','גיא אלנקוה (בן 9)',
  'אסף ורונה (אבא)','אפרת אברהם ורונה (אמא)','אלון ורונה (בן 13)','יעל ורונה (בת 15)','רועי דנקנר (בן 16)'];
var pendingSlot=null;
function makeSlot(name,rec){var d=document.createElement('div');d.className='person';
  function paint(){
    if(rec){var url=URL.createObjectURL(rec.blob);
      d.innerHTML='<button class="pdel" title="הסר תמונה">✕</button><img class="ava" src="'+url+'"><div class="pname">'+name+'</div>';
      d.querySelector('.pdel').onclick=function(){if(rec.id!=null)deletePerson(rec.id);rec=null;paint();};
    }else{d.innerHTML='<div class="ava addslot">📷</div><div class="pname">'+name+'</div>';
      d.querySelector('.addslot').onclick=function(){pendingSlot={name:name,cb:function(r){rec=r;paint();}};personInput.click();};}
  }
  paint();return d;}
function makePerson(rec){var url=URL.createObjectURL(rec.blob);var d=document.createElement('div');d.className='person';
  d.innerHTML='<button class="pdel" title="מחק">✕</button><img class="ava" src="'+url+'"><div class="pname">'+(rec.name||'')+'</div>';
  d.querySelector('.pdel').onclick=function(){if(rec.id!=null)deletePerson(rec.id);d.remove();};return d;}
function renderCrew(){allPeople().then(function(list){var byName={};list.forEach(function(p){byName[p.name]=p;});
  CREW.forEach(function(nm){crewGrid.insertBefore(makeSlot(nm,byName[nm]),addBtn);});
  list.forEach(function(p){if(CREW.indexOf(p.name)<0)crewGrid.insertBefore(makePerson(p),addBtn);});});}
addBtn.onclick=function(){pendingSlot=null;personInput.click();};
personInput.addEventListener('change',function(e){var f=(e.target.files||[])[0];personInput.value='';if(!f){pendingSlot=null;return;}
  if(pendingSlot){var nm=pendingSlot.name,cb=pendingSlot.cb;pendingSlot=null;var rec={blob:f,name:nm,ts:Date.now()};savePerson(rec).then(function(){cb(rec);});}
  else{var name=prompt('מה השם של הנוסע/ת בתמונה?')||'';var rec2={blob:f,name:name.trim(),ts:Date.now()};
    savePerson(rec2).then(function(){crewGrid.insertBefore(makePerson(rec2),addBtn);});}});

function makeScene(s,i){
  var sec=document.createElement('section');sec.className='scene';
  var bg=document.createElement('div');bg.className='scenebg';
  if(s.bg){bg.style.backgroundImage='url('+s.bg+')';}else{bg.style.background=s.grad||'linear-gradient(160deg,#0d7377,#14a0a6)';}
  sec.appendChild(bg);
  var inner=document.createElement('div');inner.className='inner';
  inner.innerHTML='<div class="head"><span class="day">'+s.day+'</span><h2>'+s.name+'</h2><div class="blurb">'+s.blurb+'</div></div><div class="polas" id="polas'+i+'"></div>';
  sec.appendChild(inner);
  var polas=inner.querySelector('#polas'+i);
  var add=document.createElement('div');add.className='addpola';add.innerHTML='<span>📷</span>הוסיפו תמונות מ'+s.name;
  add.onclick=function(){pickFor(i);};polas.appendChild(add);
  renderStop(i,polas);
  sceneObserver.observe(sec);
  return sec;
}
function renderStop(i,c){photosForStop(i).then(function(list){list.forEach(function(rec){c.insertBefore(makePola(rec),c.firstChild);});});}
function makePola(rec){var url=URL.createObjectURL(rec.blob);var d=document.createElement('div');d.className='pola';
  d.innerHTML='<img src="'+url+'"><div class="cap">'+(rec.cap||'התמונה שלנו')+'</div>';
  d.onclick=function(){openViewer(url,rec,d);};return d;}
function makeLeg(from,to){var leg=document.createElement('div');leg.className='leg';
  var id='m'+Math.round(from.lat*1000)+'_'+Math.round(to.lat*1000);
  leg.innerHTML='<div class="legh">בדרך אל <b>'+to.name+'</b></div><div class="cars">🚗 🚗 🚗</div><div class="legmap" id="'+id+'"></div>';
  leg.dataset.from=from.lat+','+from.lng;leg.dataset.to=to.lat+','+to.lng;leg.dataset.mid=id;
  legObserver.observe(leg);return leg;}

// scene reveal
var sceneObserver=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)e.target.classList.add('in');});},{threshold:0.25});

// leg maps + car animation (lazy)
var legObserver=new IntersectionObserver(function(es){es.forEach(function(e){
  if(e.isIntersecting&&!e.target.dataset.done){e.target.dataset.done='1';initLeg(e.target);}});},{threshold:0.4});
function initLeg(leg){
  var f=leg.dataset.from.split(',').map(Number),t=leg.dataset.to.split(',').map(Number);
  var map=L.map(leg.dataset.mid,{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,tap:false,keyboard:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
  var line=[[f[0],f[1]],[t[0],t[1]]];
  var bounds=L.latLngBounds(line).pad(0.35);
  L.polyline(line,{color:'#d4a843',weight:4,dashArray:'2,9',lineCap:'round'}).addTo(map);
  L.circleMarker(line[0],{radius:5,color:'#fff',fillColor:'#0d7377',fillOpacity:1}).addTo(map);
  L.circleMarker(line[1],{radius:6,color:'#fff',fillColor:'#e44d26',fillOpacity:1}).addTo(map);
  // start zoomed-in on the origin, then fly out to reveal the whole drive
  map.setView(line[0],10,{animate:false});
  setTimeout(function(){
    map.invalidateSize();
    map.flyToBounds(bounds,{duration:2.6,easeLinearity:0.25});
    driveCars(map,f,t);
    // after the cars arrive, zoom the "camera" into the destination
    setTimeout(function(){map.flyTo(line[1],11,{duration:2.2});
      setTimeout(function(){map.flyToBounds(bounds,{duration:1.8});},2600);},4700);
  },300);
}
function driveCars(map,f,t){for(var k=0;k<3;k++){(function(delay){
  var m=L.marker([f[0],f[1]],{icon:L.divIcon({html:'<div class="car">🚗</div>',className:'',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(map);
  var start=null,dur=3800;
  function step(ts){if(start===null)start=ts;var p=(ts-start-delay)/dur;
    if(p<0){requestAnimationFrame(step);return;}p=Math.min(p,1);
    m.setLatLng([f[0]+(t[0]-f[0])*p,f[1]+(t[1]-f[1])*p]);if(p<1)requestAnimationFrame(step);}
  requestAnimationFrame(step);})(k*600);}}

// add photos to a stop
var targetStop=null,fileInput=document.getElementById('fileInput');
function pickFor(i){targetStop=i;fileInput.click();}
fileInput.addEventListener('change',function(e){var files=Array.from(e.target.files||[]),idx=targetStop,c=document.getElementById('polas'+idx);
  files.forEach(function(f){var rec={blob:f,stop:idx,cap:'',ts:Date.now()};savePhoto(rec).then(function(){c.insertBefore(makePola(rec),c.firstChild);});});
  fileInput.value='';});

// viewer
var vstate=null;
function openViewer(url,rec,el){document.getElementById('viewerImg').src=url;document.getElementById('viewerCap').textContent=rec.cap||'התמונה שלנו';
  vstate={rec:rec,el:el};document.getElementById('viewer').classList.add('show');}
document.getElementById('vclose').onclick=function(){document.getElementById('viewer').classList.remove('show');};
document.getElementById('vdel').onclick=function(){if(vstate){if(vstate.rec.id!=null)deletePhoto(vstate.rec.id);if(vstate.el)vstate.el.remove();vstate=null;}document.getElementById('viewer').classList.remove('show');};

openDB().then(function(){renderCrew();buildStory();}).catch(buildStory);
</script>
